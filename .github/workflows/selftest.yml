name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # Runners have no GPU, and onnxruntime-gpu installs into the same import path as
          # plain onnxruntime -- installing both then uninstalling one deletes files the
          # other needs too. So skip the GPU wheel: faster-whisper already pulls in plain
          # onnxruntime, which is all --selftest needs (it never builds a CUDA session).
          grep -v onnxruntime-gpu requirements.txt | pip install -r /dev/stdin
      - name: Run self-checks
        run: |
          python redact.py --selftest
          python speech.py --selftest
          python upload.py --selftest
          python relay.py --selftest
